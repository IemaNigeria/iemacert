# ====================================================================
# Nginx Server Configuration for IEMA Standards Limited
# Place in /etc/nginx/sites-available/iemacert.com and symlink to sites-enabled
# ====================================================================

# 1. Redirect iemastandards.com and non-www to https://www.iemacert.com
server {
    listen 80;
    listen [::]:80;
    server_name iemastandards.com www.iemastandards.com iemacert.com;
    return 301 https://www.iemacert.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iemastandards.com www.iemastandards.com iemacert.com;
    
    # SSL certificates here
    # ssl_certificate /path/to/cert.pem;
    # ssl_certificate_key /path/to/key.pem;

    return 301 https://www.iemacert.com$request_uri;
}

# 2. Main Production Server Block for www.iemacert.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.iemacert.com;

    root /var/www/iemacert.com/dist;
    index index.html;

    # Disable directory indexing (Fixes bare directory file browsing)
    autoindex off;

    # 301 Redirects for Old Site URLs
    rewrite ^/aboutus/?$ /about-us/ permanent;
    rewrite ^/ourservices/?$ /certifications/ permanent;
    rewrite ^/our-team/?$ /our-team/ permanent;
    rewrite ^/contactus/?$ /contact-us/ permanent;
    rewrite ^/certification/?$ /certifications/ permanent;
    rewrite ^/solutions/?$ /certifications/ permanent;
    rewrite ^/our-projects/?$ /projects/ permanent;
    rewrite ^/data-protection-compliance/?$ /data-protection-compliance/ permanent;

    # ISO Standard Shortcuts to Full Descriptive URLs
    rewrite ^/iso-9001/?$ /iso-9001-certification-nigeria/ permanent;
    rewrite ^/iso-14001/?$ /iso-14001-certification-nigeria/ permanent;
    rewrite ^/iso-45001/?$ /iso-45001-certification-nigeria/ permanent;
    rewrite ^/iso-27001/?$ /iso-27001-certification-nigeria/ permanent;
    rewrite ^/iso-22000/?$ /iso-22000-certification-nigeria/ permanent;
    rewrite ^/iso-22301/?$ /iso-22301-certification-nigeria/ permanent;
    rewrite ^/iso-37001/?$ /iso-37001-certification-nigeria/ permanent;
    rewrite ^/iso-50001/?$ /iso-50001-certification-nigeria/ permanent;
    rewrite ^/iso-13485/?$ /iso-13485-certification-nigeria/ permanent;
    rewrite ^/iso-20000/?$ /iso-20000-certification-nigeria/ permanent;
    rewrite ^/iso-29001/?$ /iso-29001-certification-nigeria/ permanent;
    rewrite ^/iso-41001/?$ /iso-41001-certification-nigeria/ permanent;
    rewrite ^/iso-27701/?$ /iso-27701-certification-nigeria/ permanent;
    rewrite ^/ecomark/?$ /ecomark-certification-scheme/ permanent;
    rewrite ^/pci-dss/?$ /pci-dss-certification-nigeria/ permanent;
    rewrite ^/testing-inspection/?$ /ndt-testing/ permanent;
    rewrite ^/training/?$ /lead-auditor-training/ permanent;
    rewrite ^/inspection/?$ /inspection-services/ permanent;
    rewrite ^/environmental/?$ /environmental-consultancy-nigeria/ permanent;

    # 410 Gone for Old Demo Shop Product Pages
    location ~* ^/product/ {
        return 410;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
