<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
    <rect width="500" height="500" fill="#FFFFFF"/>
    <!-- Outer 20-Tooth Green Cog -->
    <g transform="translate(250, 250)">
      <circle cx="0" cy="0" r="190" fill="#008751" />
      <!-- Gear Teeth -->
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(0)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(18)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(36)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(54)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(72)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(90)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(108)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(126)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(144)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(162)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(180)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(198)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(216)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(234)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(252)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(270)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(288)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(306)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(324)" />
      
        <rect x="-24" y="-220" width="48" height="40" rx="4" fill="#008751" transform="rotate(342)" />
      
      
      <!-- Inner Yellow Ring -->
      <circle cx="0" cy="0" r="160" fill="#FBBF24" />
      <circle cx="0" cy="0" r="125" fill="#FEE382" />
      
      <!-- Circular Ring Text -->
      <path id="ncdmbTopArc" d="M -135,0 A 135,135 0 1,1 135,0" fill="none"/>
      <text font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#111111" letter-spacing="1">
        <textPath href="#ncdmbTopArc" startOffset="50%" text-anchor="middle">NIGERIAN CONTENT DEVELOPMENT &amp; MONITORING BOARD</textPath>
      </text>

      <!-- Center Circle Segments (Y-divided) -->
      <circle cx="0" cy="0" r="110" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
      <line x1="0" y1="0" x2="0" y2="-110" stroke="#111111" stroke-width="4"/>
      <line x1="0" y1="0" x2="-95" y2="55" stroke="#111111" stroke-width="4"/>
      <line x1="0" y1="0" x2="95" y2="55" stroke="#111111" stroke-width="4"/>

      <!-- Top Sector: Industrial Worker -->
      <g transform="translate(0, -50)">
        <circle cx="0" cy="-25" r="14" fill="#1E3A8A"/>
        <path d="M -22,15 L -10,-10 L 10,-10 L 22,15 Z" fill="#2563EB"/>
        <polygon points="-25,20 25,20 20,28 -20,28" fill="#475569"/>
      </g>

      <!-- Left Sector: Oil Derrick -->
      <g transform="translate(-45, 25)">
        <polygon points="0,-35 -18,25 18,25" fill="none" stroke="#111111" stroke-width="3"/>
        <line x1="-10" y1="-10" x2="10" y2="-10" stroke="#111111" stroke-width="2"/>
        <line x1="-14" y1="8" x2="14" y2="8" stroke="#111111" stroke-width="2"/>
        <rect x="-5" y="-40" width="10" height="8" fill="#111111"/>
      </g>

      <!-- Right Sector: Interlocking Gears -->
      <g transform="translate(45, 25)">
        <circle cx="-10" cy="-5" r="18" fill="none" stroke="#111111" stroke-width="5"/>
        <circle cx="15" cy="10" r="14" fill="none" stroke="#111111" stroke-width="4"/>
      </g>

      <!-- Bottom Arched NCDMB Badge -->
      <path d="M -75,85 Q 0,115 75,85 L 65,115 Q 0,140 -65,115 Z" fill="#008751"/>
      <text x="0" y="115" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">NCDMB</text>
    </g>
  </svg>