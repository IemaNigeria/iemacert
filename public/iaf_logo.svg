<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <!-- Official International Accreditation Forum (IAF) Logo -->
  <defs>
    <!-- Path for top text "INTERNATIONAL" -->
    <path id="top-arc" d="M 55,160 A 205,125 0 0,1 445,160" fill="none" />
    <!-- Path for bottom text "ACCREDITATION FORUM" -->
    <path id="bottom-arc" d="M 450,160 A 210,130 0 0,1 50,160" fill="none" />
    
    <!-- Clip path for globe lines inside the sphere -->
    <clipPath id="globe-clip">
      <ellipse cx="250" cy="160" rx="195" ry="98" />
    </clipPath>
  </defs>

  <!-- Main Outer Blue Oval -->
  <ellipse cx="250" cy="160" rx="245" ry="155" fill="#4676a9" />

  <!-- Top Arched Text: INTERNATIONAL -->
  <text font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="9">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
      INTERNATIONAL
    </textPath>
  </text>

  <!-- Bottom Arched Text: ACCREDITATION FORUM -->
  <text font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="6">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
      ACCREDITATION FORUM
    </textPath>
  </text>

  <!-- Globe / Sphere in Center -->
  <g clip-path="url(#globe-clip)">
    <!-- Globe background deep blue -->
    <ellipse cx="250" cy="160" rx="195" ry="98" fill="#0c3c78" stroke="#FFFFFF" stroke-width="4.5" />

    <!-- Latitude Parallels (horizontal ellipses) -->
    <ellipse cx="250" cy="160" rx="195" ry="78" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <ellipse cx="250" cy="160" rx="195" ry="58" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <ellipse cx="250" cy="160" rx="195" ry="38" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <ellipse cx="250" cy="160" rx="195" ry="18" fill="none" stroke="#FFFFFF" stroke-width="2" />
    
    <ellipse cx="250" cy="160" rx="195" ry="88" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <ellipse cx="250" cy="160" rx="195" ry="98" fill="none" stroke="#FFFFFF" stroke-width="3" />
    
    <line x1="55" y1="160" x2="445" y2="160" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Longitude Meridians (vertical ellipses/curves) -->
    <ellipse cx="250" cy="160" rx="160" ry="98" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <ellipse cx="250" cy="160" rx="125" ry="98" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <ellipse cx="250" cy="160" rx="90" ry="98" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <ellipse cx="250" cy="160" rx="55" ry="98" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <ellipse cx="250" cy="160" rx="20" ry="98" fill="none" stroke="#FFFFFF" stroke-width="2" />
    <line x1="250" y1="62" x2="250" y2="258" stroke="#FFFFFF" stroke-width="2.5" />
  </g>

  <!-- Outer Ring border around the globe -->
  <ellipse cx="250" cy="160" rx="195" ry="98" fill="none" stroke="#FFFFFF" stroke-width="4.5" />

  <!-- Center IAF Letters in Bold White with crisp outline -->
  <g id="iaf-letters">
    <!-- Letter I -->
    <path d="M 120,112 L 148,112 L 148,208 L 120,208 Z" fill="#FFFFFF" />
    
    <!-- Letter A -->
    <path d="M 248,112 L 210,208 L 236,208 L 243,189 L 267,189 L 274,208 L 300,208 L 262,112 Z M 255,148 L 263,171 L 247,171 Z" fill="#FFFFFF" />

    <!-- Letter F -->
    <path d="M 308,112 L 368,112 L 368,132 L 334,132 L 334,152 L 364,152 L 364,172 L 334,172 L 334,208 L 308,208 Z" fill="#FFFFFF" />
  </g>
</svg>
