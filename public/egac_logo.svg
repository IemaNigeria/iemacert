<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <!-- Exact reproduction of official EGAC Accredited CAB 12203 Logo -->
  <defs>
    <!-- Curved path for Arabic calligraphy: المجلس الوطني للاعتماد -->
    <path id="arabicArc" d="M 25,120 A 135,115 0 0,1 295,120" fill="none" />
  </defs>

  <g fill="#104473" stroke="#104473">
    <!-- Arabic Calligraphy at top -->
    <text font-family="'Traditional Arabic', 'Scheherazade New', 'Amiri', 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#104473" stroke="none">
      <textPath href="#arabicArc" startOffset="50%" text-anchor="middle">
        المجلس الوطني للاعتماد
      </textPath>
    </text>

    <!-- Top Hawk / Eagle of Saladin -->
    <path d="M 135 70 C 137 63, 142 58, 148 57 C 158 55, 168 62, 172 65 C 176 68, 182 66, 180 61 C 176 52, 165 48, 155 49 C 145 50, 137 55, 134 60 C 130 55, 120 50, 110 52 C 102 54, 96 60, 96 68 C 96 76, 102 85, 112 88 L 120 90 L 120 120 L 148 120 L 148 95 C 160 92, 170 85, 178 75 C 185 85, 198 90, 208 88 C 218 85, 224 76, 224 68 C 224 60, 218 54, 210 52 C 200 50, 190 55, 186 60 C 183 55, 175 50, 165 49 L 160 55 Z" fill="#104473" stroke="none" transform="translate(-10, 8)" />
    
    <!-- Stylized Eagle Wings & Head -->
    <g transform="translate(160, 90)">
      <!-- Head facing right -->
      <path d="M -8,-25 C -5,-32 10,-32 15,-26 C 22,-26 25,-22 20,-18 C 12,-18 10,-14 6,-14 C 2,-14 -2,-18 -8,-25 Z" fill="#104473" stroke="none"/>
      <!-- Body & Wings -->
      <path d="M -65,-5 C -45,-15 -25,-12 -12,-8 L 0,-8 L 12,-8 C 25,-12 45,-15 65,-5 C 50,15 35,22 20,25 L -20,25 C -35,22 -50,15 -65,-5 Z" fill="#104473" stroke="none"/>
    </g>

    <!-- Pyramids of Giza & Central Structure -->
    <g stroke="none">
      <!-- Left pyramid slope -->
      <polygon points="110,95 16,192 122,192" fill="#104473" />
      <!-- Left pyramid white cut/facet -->
      <polygon points="110,95 122,192 165,192" fill="#FFFFFF" />
      
      <!-- Central Pillar / Tower -->
      <rect x="150" y="100" width="18" height="50" fill="#104473" />
      <!-- Central structure roof -->
      <polygon points="145,115 159,98 173,115" fill="#104473" />
      
      <!-- Center Main Pyramid -->
      <polygon points="160,110 120,192 195,192" fill="#104473" />
      
      <!-- Center right slope light facet -->
      <polygon points="160,110 195,192 250,192" fill="#104473" />
      
      <!-- Right Pyramid -->
      <polygon points="215,130 250,192 305,192" fill="#104473" />
      
      <!-- Stepped cutaways on pyramid faces matching exact logo -->
      <polygon points="65,192 110,95 125,192" fill="#FFFFFF" />
      <polygon points="120,192 160,110 175,192" fill="#104473" />
      <polygon points="175,192 160,110 215,192" fill="#FFFFFF" />
      <polygon points="215,192 230,135 255,192" fill="#104473" />
      <polygon points="255,192 230,135 285,192" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Horizontal Divider Line -->
  <rect x="10" y="195" width="300" height="8" fill="#104473" rx="2" />

  <!-- EGAC Typography in Dark Blue Serif font -->
  <text x="160" y="255" text-anchor="middle" fill="#104473" font-family="'Times New Roman', Times, Georgia, serif" font-weight="900" font-size="58" letter-spacing="4">
    EGAC
  </text>

  <!-- Accredited Typography in Bold Sans-Serif -->
  <text x="160" y="305" text-anchor="middle" fill="#104473" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="900" font-size="44" letter-spacing="1">
    Accredited
  </text>

  <!-- CAB 12203 Registration -->
  <text x="160" y="375" text-anchor="middle" fill="#143b73" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="900" font-size="42" letter-spacing="2">
    CAB 12203
  </text>
</svg>
